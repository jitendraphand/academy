services:
  academy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_EMAIL=admin@salon.academy
      - ADMIN_PASSWORD=admin123
      - SESSION_SECRET=change-me-in-production
    volumes:
      - academy-data:/app/data
    restart: unless-stopped

volumes:
  academy-data:
